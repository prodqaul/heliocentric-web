<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>

    <!-- Satellite Map Base Gradient -->
    <linearGradient id="mapDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b1e"/>
      <stop offset="40%" stop-color="#0a1818"/>
      <stop offset="70%" stop-color="#061214"/>
      <stop offset="100%" stop-color="#040b0d"/>
    </linearGradient>

    <!-- Glowing Alert Reticle Gradient -->
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Drone Vector Gradient -->
    <linearGradient id="dronePath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="dbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#dbBg)"/>

  <!-- ==================== TOP NAVIGATION BAR ==================== -->
  <rect x="0" y="0" width="1200" height="56" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <g transform="translate(20, 16)">
    <rect width="28" height="26" rx="6" fill="#16a34a"/>
    <path d="M 6,18 L 14,7 L 22,18 Z" fill="#ffffff"/>
    <text x="38" y="18" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="0.5">EZA CLIMAVISE</text>
    <text x="160" y="18" fill="#64748b" font-size="12" font-weight="600">|</text>
    <text x="175" y="18" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">CONSERVATION INTELLIGENCE OPS</text>
  </g>

  <!-- Live Status Indicators -->
  <g transform="translate(620, 18)">
    <circle cx="0" cy="9" r="4.5" fill="#22c55e" filter="url(#dbGlow)"/>
    <text x="10" y="13" fill="#e2e8f0" font-size="11.5" font-weight="600">SAR + OPTICAL FUSION: <tspan fill="#4ade80">ONLINE</tspan></text>

    <circle cx="210" cy="9" r="4.5" fill="#38bdf8"/>
    <text x="220" y="13" fill="#e2e8f0" font-size="11.5" font-weight="600">IOT MESH: <tspan fill="#38bdf8">48/48 ACTIVE</tspan></text>

    <!-- Critical Alert Counter Badge -->
    <rect x="360" y="-3" width="165" height="26" rx="13" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <circle cx="376" cy="10" r="4" fill="#ef4444" filter="url(#dbGlow)"/>
    <text x="388" y="14" fill="#fca5a5" font-size="11" font-weight="700">3 CRITICAL ALERTS</text>
  </g>

  <!-- ==================== LEFT SIDEBAR NAVIGATION ==================== -->
  <g transform="translate(0, 56)">
    <rect width="210" height="619" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Navigation Items -->
    <!-- Item 1: Active Overview -->
    <g transform="translate(12, 16)">
      <rect width="186" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="8" width="3" height="22" rx="1.5" fill="#22c55e"/>
      <path d="M 22,20 L 22,26 L 27,26 L 27,20 L 22,20 Z M 16,16 L 24.5,9 L 33,16" fill="none" stroke="#22c55e" stroke-width="1.8"/>
      <text x="44" y="24" fill="#f8fafc" font-size="12.5" font-weight="700">Live GIS Map</text>
    </g>

    <!-- Item 2: Deforestation Alerts -->
    <g transform="translate(12, 62)">
      <rect width="186" height="38" rx="8" fill="transparent"/>
      <path d="M 24,12 L 34,28 L 14,28 Z" fill="none" stroke="#ef4444" stroke-width="1.8"/>
      <text x="44" y="24" fill="#cbd5e1" font-size="12.5" font-weight="600">Deforestation Alerts</text>
      <circle cx="172" cy="19" r="8" fill="#ef4444"/>
      <text x="169" y="23" fill="#ffffff" font-size="10" font-weight="800">3</text>
    </g>

    <!-- Item 3: Drone Fleet -->
    <g transform="translate(12, 108)">
      <rect width="186" height="38" rx="8" fill="transparent"/>
      <path d="M 18,14 L 30,14 M 24,14 L 24,26 M 15,26 L 33,26" stroke="#94a3b8" stroke-width="1.8"/>
      <text x="44" y="24" fill="#94a3b8" font-size="12.5" font-weight="600">UAV Drone Fleet</text>
      <text x="165" y="24" fill="#38bdf8" font-size="11" font-weight="700">2 Ready</text>
    </g>

    <!-- Item 4: IoT Acoustic Sensors -->
    <g transform="translate(12, 154)">
      <rect width="186" height="38" rx="8" fill="transparent"/>
      <circle cx="24" cy="20" r="5" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
      <path d="M 16,20 A 10,10 0 0,1 32,20" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="44" y="24" fill="#94a3b8" font-size="12.5" font-weight="600">IoT Acoustic Mesh</text>
    </g>

    <!-- Item 5: Wildlife Boundaries -->
    <g transform="translate(12, 200)">
      <rect width="186" height="38" rx="8" fill="transparent"/>
      <path d="M 18,14 Q 24,8 30,14 T 30,26 T 18,26 Z" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
      <text x="44" y="24" fill="#94a3b8" font-size="12.5" font-weight="600">Wildlife Boundaries</text>
    </g>

    <!-- Item 6: Reports & Logs -->
    <g transform="translate(12, 246)">
      <rect width="186" height="38" rx="8" fill="transparent"/>
      <rect x="18" y="12" width="14" height="18" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
      <line x1="22" y1="17" x2="28" y2="17" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="22" y1="22" x2="28" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="44" y="24" fill="#94a3b8" font-size="12.5" font-weight="600">Audit &amp; Evidence</text>
    </g>

    <!-- Bottom Area Info Card -->
    <g transform="translate(12, 450)">
      <rect width="186" height="140" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.5">MONITORED ZONE</text>
      <text x="14" y="44" fill="#f8fafc" font-size="13" font-weight="800">Volcanoes National Park</text>
      <text x="14" y="62" fill="#94a3b8" font-size="11">Total Area: 160 km²</text>
      
      <line x1="14" y1="74" x2="172" y2="74" stroke="#1e293b" stroke-width="1"/>
      
      <text x="14" y="94" fill="#64748b" font-size="10" font-weight="700">SATELLITE PASS</text>
      <text x="14" y="112" fill="#4ade80" font-size="12" font-weight="700">Sentinel-1 SAR: <tspan fill="#e2e8f0">4m ago</tspan></text>
      <text x="14" y="128" fill="#94a3b8" font-size="10.5">Cloud Cover: 64% (Penetrated)</text>
    </g>
  </g>

  <!-- ==================== CENTRAL GIS SATELLITE MAP ==================== -->
  <g transform="translate(210, 56)">
    <!-- Map Canvas Base -->
    <rect width="660" height="619" fill="url(#mapDark)"/>
    <rect width="660" height="619" fill="url(#dbGrid)" opacity="0.6"/>

    <!-- Forest & Topo Topographic Curves -->
    <g stroke="#1e3a2f" stroke-width="1.5" fill="none" opacity="0.45">
      <ellipse cx="260" cy="280" rx="180" ry="140"/>
      <ellipse cx="260" cy="280" rx="130" ry="100"/>
      <ellipse cx="260" cy="280" rx="80" ry="60"/>
      <ellipse cx="510" cy="210" rx="120" ry="90"/>
      <ellipse cx="510" cy="210" rx="80" ry="55"/>
      <ellipse cx="440" cy="460" rx="150" ry="110"/>
      <ellipse cx="440" cy="460" rx="100" ry="70"/>
    </g>

    <!-- River Waterway Flowing on Map -->
    <path d="M 60,30 Q 180,180 230,320 T 360,590" fill="none" stroke="#0369a1" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <path d="M 60,30 Q 180,180 230,320 T 360,590" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Protected Reserve Boundary Line (Green Vector) -->
    <polygon points="70,90 320,60 590,110 610,380 490,560 160,540 60,340" fill="#14532d" fill-opacity="0.12" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4" filter="url(#dbGlow)"/>

    <!-- Sector Labels on Map -->
    <text x="140" y="160" fill="#22c55e" font-size="11" font-weight="700" letter-spacing="1">SECTOR ALPHA (NORTH)</text>
    <text x="360" y="140" fill="#22c55e" font-size="11" font-weight="700" letter-spacing="1">SECTOR GAMMA (EAST)</text>
    <text x="190" y="490" fill="#22c55e" font-size="11" font-weight="700" letter-spacing="1">SECTOR DELTA (SOUTH)</text>
    <text x="310" y="270" fill="#ef4444" font-size="11" font-weight="800" letter-spacing="1">SECTOR BETA (ACTIVE BREACH)</text>

    <!-- CRITICAL ALERT TARGET RETICLE IN SECTOR BETA -->
    <g transform="translate(390, 310)">
      <!-- Pulsing Aura -->
      <circle cx="0" cy="0" r="70" fill="url(#alertGlow)"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#dbGlow)"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#ef4444" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#ef4444"/>
      <!-- Crosshairs -->
      <line x1="-50" y1="0" x2="-22" y2="0" stroke="#ef4444" stroke-width="2"/>
      <line x1="22" y1="0" x2="50" y2="0" stroke="#ef4444" stroke-width="2"/>
      <line x1="0" y1="-50" x2="0" y2="-22" stroke="#ef4444" stroke-width="2"/>
      <line x1="0" y1="22" x2="0" y2="50" stroke="#ef4444" stroke-width="2"/>

      <!-- Target Pin Callout Tag -->
      <g transform="translate(48, -45)">
        <rect width="180" height="42" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" filter="url(#dbGlow)"/>
        <text x="10" y="17" fill="#f87171" font-size="10.5" font-weight="800">ALERT #AL-8492 // CRITICAL</text>
        <text x="10" y="32" fill="#e2e8f0" font-size="11" font-weight="600">1°28'34.2"S 29°36'11.8"E</text>
      </g>
    </g>

    <!-- Drone Flight Path Vector towards target -->
    <path d="M 120,440 Q 230,420 370,330" fill="none" stroke="url(#dronePath)" stroke-width="2.5" stroke-dasharray="5 3"/>
    
    <!-- Drone Icon at (120, 440) -->
    <g transform="translate(120, 440)">
      <circle cx="0" cy="0" r="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M -8,-8 L 8,8 M -8,8 L 8,-8" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <text x="18" y="4" fill="#38bdf8" font-size="10" font-weight="800">UAV-01 EN ROUTE (4K)</text>
    </g>

    <!-- Floating Map Controls (Top Right of Map) -->
    <g transform="translate(540, 16)">
      <rect width="104" height="34" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="12" y="21" fill="#4ade80" font-size="11" font-weight="700">SAR LAYER</text>
      <circle cx="86" cy="17" r="7" fill="#15803d"/>
      <circle cx="86" cy="17" r="3" fill="#ffffff"/>
    </g>

    <!-- Map Coordinate Axis Indicators -->
    <text x="16" y="605" fill="#64748b" font-size="10" font-family="monospace">SCALE: 1:25,000 | DATUM: WGS84 | PROJECTION: UTM ZONE 35S</text>
  </g>

  <!-- ==================== RIGHT INCIDENT & TELEMETRY PANEL ==================== -->
  <g transform="translate(870, 56)">
    <rect width="330" height="619" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

    <!-- Incident Card Header -->
    <g transform="translate(16, 16)">
      <rect width="298" height="52" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="20" cy="26" r="6" fill="#ef4444" filter="url(#dbGlow)"/>
      <text x="36" y="23" fill="#fca5a5" font-size="11" font-weight="800" letter-spacing="0.5">ALERT INCIDENT #AL-8492</text>
      <text x="36" y="40" fill="#ffffff" font-size="14" font-weight="800">SEVERITY: CRITICAL</text>
    </g>

    <!-- Incident Details Fields -->
    <g transform="translate(16, 82)">
      <rect width="298" height="154" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      
      <text x="14" y="24" fill="#94a3b8" font-size="10.5" font-weight="700">TARGET LOCATION</text>
      <text x="14" y="42" fill="#f8fafc" font-size="12" font-weight="700">Sector Beta (Karisimbi North Slopes)</text>
      <text x="14" y="58" fill="#38bdf8" font-size="11" font-family="monospace">1°28'34.2"S  29°36'11.8"E</text>

      <line x1="14" y1="70" x2="284" y2="70" stroke="#334155" stroke-width="1"/>

      <text x="14" y="90" fill="#94a3b8" font-size="10.5" font-weight="700">CORRELATED THREAT ANOMALY</text>
      <text x="14" y="108" fill="#ef4444" font-size="12" font-weight="700">Chainsaw Sound + Rapid Canopy Loss</text>
      <text x="14" y="126" fill="#94a3b8" font-size="10.5">Detection: <tspan fill="#e2e8f0" font-weight="600">IoT Node #14 + U-Net CNN</tspan></text>
      <text x="14" y="142" fill="#94a3b8" font-size="10.5">AI Confidence: <tspan fill="#4ade80" font-weight="700">98.6% (Verified)</tspan></text>
    </g>

    <!-- Real-Time Acoustic & NDVI Telemetry Charts -->
    <g transform="translate(16, 250)">
      <rect width="298" height="135" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-size="10.5" font-weight="700">ACOUSTIC FREQUENCY SPECTRUM (NODE #14)</text>
      
      <!-- Spectrum Bar Graph -->
      <g transform="translate(14, 34)">
        <rect x="0" y="30" width="8" height="25" fill="#334155"/>
        <rect x="12" y="24" width="8" height="31" fill="#334155"/>
        <rect x="24" y="36" width="8" height="19" fill="#334155"/>
        <rect x="36" y="20" width="8" height="35" fill="#334155"/>
        <rect x="48" y="15" width="8" height="40" fill="#eab308"/>
        <!-- Chainsaw spike bars -->
        <rect x="60" y="4" width="9" height="51" fill="#ef4444" filter="url(#dbGlow)"/>
        <rect x="72" y="2" width="9" height="53" fill="#ef4444" filter="url(#dbGlow)"/>
        <rect x="84" y="8" width="9" height="47" fill="#ef4444"/>
        <rect x="96" y="18" width="8" height="37" fill="#eab308"/>
        <rect x="108" y="28" width="8" height="27" fill="#334155"/>
        <rect x="120" y="38" width="8" height="17" fill="#334155"/>
        <rect x="132" y="40" width="8" height="15" fill="#334155"/>
        <text x="60" y="-3" fill="#ef4444" font-size="9" font-weight="800">2.4 kHz (Chainsaw)</text>
      </g>
      
      <line x1="14" y1="98" x2="284" y2="98" stroke="#334155" stroke-width="0.75"/>
      <text x="14" y="114" fill="#94a3b8" font-size="10">NDVI Anomaly Index: <tspan fill="#ef4444" font-weight="700">-0.48 (Canopy Drop)</tspan></text>
      <text x="14" y="128" fill="#94a3b8" font-size="10">Decibel Level: <tspan fill="#f59e0b" font-weight="700">88.4 dB @ 120m</tspan></text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(16, 400)">
      <!-- Primary Action: Dispatch Drone -->
      <rect width="298" height="46" rx="8" fill="#16a34a" stroke="#22c55e" stroke-width="1" filter="url(#dbGlow)"/>
      <path d="M 32,23 L 42,23 M 37,18 L 37,28" stroke="#ffffff" stroke-width="2"/>
      <text x="54" y="28" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="0.5">DISPATCH DRONE VERIFICATION</text>
      
      <!-- Secondary Action: Notify Ranger Patrol -->
      <g transform="translate(0, 56)">
        <rect width="298" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="50" y="26" fill="#e2e8f0" font-size="11.5" font-weight="700">ALERT RANGER PATROL #04</text>
      </g>

      <!-- Third Action: Export Incident Dossier -->
      <g transform="translate(0, 108)">
        <rect width="298" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="64" y="26" fill="#94a3b8" font-size="11.5" font-weight="600">Download Legal Evidence Dossier</text>
      </g>
    </g>
  </g>
</svg>
