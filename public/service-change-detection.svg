<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Intact Forest Gradient -->
    <radialGradient id="forestLush" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#144d29"/>
      <stop offset="40%" stop-color="#0e3a1f"/>
      <stop offset="75%" stop-color="#092815"/>
      <stop offset="100%" stop-color="#05190d"/>
    </radialGradient>

    <!-- Degraded Forest Gradient -->
    <radialGradient id="forestCut" cx="55%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a4527"/>
      <stop offset="35%" stop-color="#12351d"/>
      <stop offset="70%" stop-color="#0c2313"/>
      <stop offset="100%" stop-color="#06140b"/>
    </radialGradient>

    <!-- Deforestation Cleared Dirt Soil Gradient -->
    <linearGradient id="soilCut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Glowing Alert Polygon Fill -->
    <linearGradient id="polyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="svgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="600" fill="url(#mainBg)"/>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(36, 32)">
    <text x="0" y="24" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.3">Automatic Forest Loss Verification</text>
    <text x="0" y="48" fill="#94a3b8" font-size="14" font-weight="500">Comparing untouched baseline terrain with today&apos;s live satellite capture</text>
    
    <!-- Top-Right Time Interval Badge -->
    <g transform="translate(930, 6)">
      <rect width="198" height="36" rx="8" fill="#0f2338" stroke="#0284c7" stroke-width="0.8"/>
      <!-- Calendar Icon -->
      <g transform="translate(14, 10)">
        <rect x="0" y="2" width="14" height="13" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="0" y1="6" x2="14" y2="6" stroke="#38bdf8" stroke-width="1.2"/>
        <line x1="3" y1="0" x2="3" y2="3" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="11" y1="0" x2="11" y2="3" stroke="#38bdf8" stroke-width="1.5"/>
      </g>
      <text x="36" y="23" fill="#38bdf8" font-size="12" font-weight="700">Time Interval: <tspan fill="#7dd3fc" font-weight="800">165 Days Apart</tspan></text>
    </g>
  </g>

  <!-- ==================== MAIN COMPARISON CARDS ==================== -->
  <g transform="translate(36, 100)">
    <!-- ==================== LEFT CARD: HISTORICAL BASELINE ==================== -->
    <g id="leftBaselineCard">
      <!-- Card Container with Rounded Corners -->
      <rect width="548" height="460" rx="14" fill="#0b1320" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
      <clipPath id="leftClip">
        <rect width="548" height="460" rx="14"/>
      </clipPath>

      <g clip-path="url(#leftClip)">
        <!-- Forest Landscape Base -->
        <rect width="548" height="460" fill="url(#forestLush)"/>

        <!-- Dense Tree Canopy Canopy Texture Elements -->
        <g fill="#166534" opacity="0.45">
          <circle cx="80" cy="90" r="42"/>
          <circle cx="150" cy="110" r="50"/>
          <circle cx="230" cy="80" r="45"/>
          <circle cx="310" cy="100" r="55"/>
          <circle cx="420" cy="90" r="60"/>
          <circle cx="500" cy="120" r="50"/>
          <circle cx="70" cy="180" r="52"/>
          <circle cx="140" cy="200" r="48"/>
          <circle cx="430" cy="190" r="55"/>
          <circle cx="510" cy="220" r="58"/>
          <circle cx="90" cy="290" r="55"/>
          <circle cx="400" cy="280" r="52"/>
          <circle cx="480" cy="310" r="60"/>
          <circle cx="80" cy="390" r="58"/>
          <circle cx="160" cy="410" r="52"/>
          <circle cx="440" cy="400" r="65"/>
          <circle cx="510" cy="410" r="50"/>
        </g>
        <g fill="#22c55e" opacity="0.2">
          <circle cx="110" cy="130" r="28"/>
          <circle cx="190" cy="160" r="32"/>
          <circle cx="380" cy="140" r="35"/>
          <circle cx="460" cy="160" r="30"/>
          <circle cx="110" cy="250" r="34"/>
          <circle cx="370" cy="240" r="36"/>
          <circle cx="440" cy="270" r="32"/>
          <circle cx="120" cy="350" r="30"/>
          <circle cx="380" cy="360" r="38"/>
          <circle cx="460" cy="360" r="34"/>
        </g>

        <!-- Winding River through the Intact Rainforest -->
        <path d="M 490,40 Q 320,130 260,200 T 150,330 T 40,460" fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round" opacity="0.75"/>
        <path d="M 490,40 Q 320,130 260,200 T 150,330 T 40,460" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
        <path d="M 490,40 Q 320,130 260,200 T 150,330 T 40,460" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

        <!-- Top Dark Overlay Header -->
        <rect x="14" y="14" width="520" height="42" rx="8" fill="#0b1120" fill-opacity="0.88" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Top Left Badge: HISTORICAL BASELINE -->
        <circle cx="32" cy="35" r="4.5" fill="#22c55e" filter="url(#svgGlow)"/>
        <text x="44" y="39" fill="#f8fafc" font-size="12" font-weight="800" letter-spacing="0.5">HISTORICAL BASELINE</text>
        <circle cx="194" cy="35" r="2" fill="#64748b"/>
        <text x="204" y="39" fill="#94a3b8" font-size="11.5" font-weight="500">Untouched Rainforest (Before)</text>

        <!-- Top Right Tag: Captured Oct 2023 -->
        <rect x="400" y="20" width="126" height="30" rx="6" fill="#1e293b" fill-opacity="0.8"/>
        <text x="412" y="40" fill="#cbd5e1" font-size="11" font-weight="600">Captured Oct 2023</text>

        <!-- Bottom Pill: Pristine Continuous Canopy -->
        <g transform="translate(18, 408)">
          <rect width="260" height="36" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#15803d" stroke-width="1"/>
          <!-- Leaf Icon -->
          <path d="M 20,24 C 20,15 28,12 32,12 C 32,18 29,24 20,24 Z M 20,24 L 26,18" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round"/>
          <text x="38" y="23" fill="#f8fafc" font-size="11.5" font-weight="700">Pristine Continuous Canopy</text>
          <circle cx="196" cy="18" r="2" fill="#64748b"/>
          <text x="204" y="23" fill="#4ade80" font-size="11.5" font-weight="700">100% Intact</text>
        </g>
      </g>
    </g>

    <!-- ==================== CENTER FLOATING PILL ==================== -->
    <g transform="translate(506, 215)" filter="url(#svgGlow)">
      <rect width="116" height="38" rx="19" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <!-- Clock Icon -->
      <circle cx="22" cy="19" r="6" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
      <polyline points="22,16 22,19 25,19" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
      <text x="34" y="23" fill="#f8fafc" font-size="10.5" font-weight="800" letter-spacing="0.3">165 DAYS APART</text>
      <text x="100" y="23" fill="#22d3ee" font-size="12" font-weight="800">→</text>
    </g>

    <!-- ==================== RIGHT CARD: LIVE SATELLITE DETECTION ==================== -->
    <g id="rightDetectionCard" transform="translate(580, 0)">
      <!-- Card Container with Red Tinted Border -->
      <rect width="548" height="460" rx="14" fill="#0b1320" stroke="#7f1d1d" stroke-width="1.5" filter="url(#cardShadow)"/>
      <clipPath id="rightClip">
        <rect width="548" height="460" rx="14"/>
      </clipPath>

      <g clip-path="url(#rightClip)">
        <!-- Forest Base -->
        <rect width="548" height="460" fill="url(#forestCut)"/>

        <!-- Trees Texture -->
        <g fill="#14532d" opacity="0.4">
          <circle cx="80" cy="90" r="42"/>
          <circle cx="150" cy="110" r="50"/>
          <circle cx="420" cy="90" r="60"/>
          <circle cx="500" cy="120" r="50"/>
          <circle cx="70" cy="180" r="52"/>
          <circle cx="90" cy="290" r="55"/>
          <circle cx="480" cy="310" r="60"/>
          <circle cx="80" cy="390" r="58"/>
          <circle cx="440" cy="400" r="65"/>
        </g>

        <!-- Winding River continued on Right (Disrupted) -->
        <path d="M 490,40 Q 320,130 260,200 T 150,330 T 40,460" fill="none" stroke="#0369a1" stroke-width="20" stroke-linecap="round" opacity="0.55"/>
        <path d="M 490,40 Q 320,130 260,200 T 150,330 T 40,460" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

        <!-- ILLEGAL LOGGING ROAD CUTTING THROUGH FOREST (Bare Earth / Bulldozed Corridor) -->
        <path d="M 10,290 Q 140,280 230,260 T 360,240 T 480,270 T 540,320" fill="none" stroke="url(#soilCut)" stroke-width="48" stroke-linecap="round" opacity="0.95"/>
        <path d="M 10,290 Q 140,280 230,260 T 360,240 T 480,270 T 540,320" fill="none" stroke="#d97706" stroke-width="28" stroke-linecap="round" opacity="0.8"/>
        <path d="M 10,290 Q 140,280 230,260 T 360,240 T 480,270 T 540,320" fill="none" stroke="#fef3c7" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

        <!-- Felled Timber / Debris Scars along road edges -->
        <g stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.8">
          <line x1="120" y1="260" x2="135" y2="272"/>
          <line x1="180" y1="245" x2="195" y2="258"/>
          <line x1="260" y1="230" x2="275" y2="242"/>
          <line x1="330" y1="220" x2="345" y2="234"/>
          <line x1="410" y1="240" x2="425" y2="255"/>
          <line x1="470" y1="280" x2="485" y2="295"/>
        </g>

        <!-- RED DASHED TRAJECTORY VECTOR (Logging Expansion Track) -->
        <path d="M 20,330 Q 140,360 260,370" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="8 5" filter="url(#svgGlow)"/>

        <!-- ACTIVE DEFORESTATION POLYGON OVERLAY (Red Heatmap Zone) -->
        <polygon points="255,305 320,270 375,320 450,390 380,450 300,410 265,360" fill="url(#polyGlow)" stroke="#ef4444" stroke-width="2.5" filter="url(#svgGlow)"/>
        
        <!-- Polygon Vertex Alert Pins -->
        <circle cx="265" cy="360" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" filter="url(#svgGlow)"/>
        <circle cx="380" cy="450" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

        <!-- FLOATING ALERT CARD: Active Deforestation Incursion -->
        <g transform="translate(230, 130)" filter="url(#cardShadow)">
          <rect width="298" height="114" rx="10" fill="#0b1120" fill-opacity="0.95" stroke="#ef4444" stroke-width="1.2"/>
          
          <!-- Warning Icon & Title Row -->
          <g transform="translate(14, 14)">
            <!-- Warning Triangle -->
            <path d="M 6,1 L 12,12 L 0,12 Z" fill="#ef4444"/>
            <text x="4.5" y="11" fill="#ffffff" font-size="8" font-weight="900">!</text>
            <text x="18" y="11" fill="#f87171" font-size="11.5" font-weight="800" letter-spacing="0.2">Active Deforestation Incursion</text>
            
            <!-- Green Verified Pill -->
            <rect x="194" y="-3" width="76" height="20" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="0.8"/>
            <text x="202" y="11" fill="#4ade80" font-size="10" font-weight="800">95% Verified</text>
          </g>

          <!-- Detected Clearing Headline -->
          <text x="14" y="58" fill="#ffffff" font-size="13.5" font-weight="800">Detected Clearing: 14.6 Hectares</text>
          <text x="14" y="74" fill="#fca5a5" font-size="12" font-weight="700">(95% Certainty)</text>

          <!-- Subtitle Description -->
          <text x="14" y="98" fill="#94a3b8" font-size="11" font-weight="500">Illegal access road cutting into protected reserve</text>
        </g>

        <!-- Top Dark Overlay Header -->
        <rect x="14" y="14" width="520" height="42" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#7f1d1d" stroke-width="1"/>

        <!-- Top Left Badge: LIVE SATELLITE DETECTION -->
        <circle cx="32" cy="35" r="4.5" fill="#ef4444" filter="url(#svgGlow)"/>
        <text x="44" y="39" fill="#f8fafc" font-size="12" font-weight="800" letter-spacing="0.5">LIVE SATELLITE DETECTION</text>
        <circle cx="214" cy="35" r="2" fill="#ef4444"/>
        <text x="224" y="39" fill="#fca5a5" font-size="11.5" font-weight="600">Illegal Logging Road Detected (After)</text>

        <!-- Top Right Tag: Captured Today • Fresh Cut (Crimson) -->
        <rect x="382" y="20" width="144" height="30" rx="6" fill="#991b1b"/>
        <text x="392" y="40" fill="#ffffff" font-size="11" font-weight="800">Captured Today • Fresh Cut</text>

        <!-- Bottom Pill: Target Sector -->
        <g transform="translate(18, 408)">
          <rect width="280" height="36" rx="8" fill="#0b1120" fill-opacity="0.92" stroke="#7f1d1d" stroke-width="1"/>
          <circle cx="16" cy="18" r="4" fill="#ef4444" filter="url(#svgGlow)"/>
          <text x="28" y="23" fill="#cbd5e1" font-size="11.5" font-weight="600">Target Sector: <tspan fill="#f8fafc" font-weight="800">JAI PH-3 Ecological Corridor</tspan></text>
        </g>
      </g>
    </g>
  </g>
</svg>